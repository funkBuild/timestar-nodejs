name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libzstd-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build:ts

      - name: Type check
        run: npx tsc --noEmit

      # No server in this job: the correctness suite (test/correctness/)
      # requires a live TimeStar and runs in the integration-test job.
      - name: Run unit tests
        run: npm test -- --exclude 'test/correctness/**'

  integration-test:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libzstd-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build:ts

      # Canonical correctness-suite setup (see test/correctness/helpers.ts):
      # 2MB WAL threshold so flush/oversized-batch tests can trigger cheaply,
      # and the data dir shared with the runner so flushes are VERIFIED by
      # watching WAL files roll over (the image's WORKDIR is
      # /var/lib/timestar, where shard_N directories are created).
      - name: Start TimeStar container
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tsdata"
          chmod 777 "$GITHUB_WORKSPACE/tsdata"
          docker run -d --name timestar \
            -p 8086:8086 \
            -e TIMESTAR_OVERPROVISIONED=true \
            -e TIMESTAR_WAL_SIZE_THRESHOLD=2097152 \
            -v "$GITHUB_WORKSPACE/tsdata:/var/lib/timestar" \
            funkbuild/timestar:latest \
            --smp 1 --memory 512M

      - name: Wait for TimeStar to be healthy
        run: |
          echo "Waiting for TimeStar..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8086/health > /dev/null 2>&1; then
              echo "TimeStar is healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "TimeStar failed to start"
          docker logs timestar
          exit 1

      - name: Run integration tests
        run: npm test
        env:
          TIMESTAR_HOST: localhost
          TIMESTAR_PORT: 8086
          TIMESTAR_DATA_DIR: ${{ github.workspace }}/tsdata
          TIMESTAR_WAL_THRESHOLD: "2097152"

      - name: TimeStar logs (on failure)
        if: failure()
        run: docker logs timestar

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, integration-test]
    runs-on: ubuntu-24.04
    environment: NPM Publish

    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libzstd-dev

      - name: Install npm dependencies
        run: npm install

      - name: Build
        run: npm run build:ts

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag v${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Publishing version ${PKG_VERSION}"

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
